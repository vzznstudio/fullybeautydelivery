<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fully Beauty — Delivery</title>
<style>
  :root{
    --black:#000;
    --white:#fff;
    --muted:rgba(255,255,255,.42);
    --muted-2:rgba(255,255,255,.24);
    --line:rgba(255,255,255,.18);
    --green:#3ba776;
    --green-dim:rgba(59,167,118,.12);
    --ease:cubic-bezier(.16,1,.3,1);
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{background:var(--black);}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--white);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- custom cursor ---------- */
  .cursor{
    position:fixed;top:0;left:0;
    width:22px;height:22px;border-radius:50%;
    background:var(--white);
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    mix-blend-mode:difference;
    transition:width .3s var(--ease),height .3s var(--ease),opacity .3s;
  }
  .cursor-glow{
    position:fixed;top:0;left:0;
    width:60px;height:60px;border-radius:50%;
    background:rgba(255,255,255,.5);
    filter:blur(22px);
    pointer-events:none;
    z-index:9998;
    transform:translate(-50%,-50%);
    opacity:.9;
  }
  .cursor.is-big{width:44px;height:44px}
  @media (hover:none),(pointer:coarse){
    .cursor,.cursor-glow{display:none}
    body{cursor:auto}
  }
  @media (hover:hover) and (pointer:fine){
    body,a,button{cursor:none}
  }

  /* ---------- brand logo ---------- */
  .logo{
    border-radius:50%;
    object-fit:contain;
    background:var(--white);
    padding:6px;
    display:block;
  }
  div.logo{padding:0}
  .logo--lg{width:118px;height:118px}
  .logo--sm{width:38px;height:38px;padding:3px}

  /* ---------- pill button ---------- */
  .pill{
    position:relative;
    display:inline-block;
    padding:15px 40px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--white);
    font:inherit;
    font-size:12px;
    letter-spacing:.19em;
    text-transform:uppercase;
    overflow:hidden;
    isolation:isolate;
    transition:border-color .5s var(--ease),color .5s var(--ease);
  }
  .pill::before{
    content:"";
    position:absolute;inset:0;
    background:var(--white);
    transform:scaleX(0);
    transform-origin:left center;
    transition:transform .55s var(--ease);
    z-index:-1;
  }
  .pill:hover::before,.pill:focus-visible::before{transform:scaleX(1)}
  .pill:hover,.pill:focus-visible{color:var(--black);border-color:var(--white)}
  .pill:focus-visible{outline:2px solid var(--white);outline-offset:4px}

  /* ---------- screen 1 ---------- */
  #welcome{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:34px;
    background:var(--black);
    z-index:50;
    transition:opacity .9s var(--ease),visibility .9s;
  }
  #welcome.is-out{opacity:0;visibility:hidden}

  .welcome-name{
    font-size:13px;
    letter-spacing:.42em;
    text-transform:uppercase;
    text-indent:.42em;
    color:var(--white);
  }

  /* ---------- screen 2 ---------- */
  #delivery{
    opacity:0;
    transition:opacity 1s var(--ease) .15s;
    padding:34px 30px 60px;
    max-width:1180px;
    margin:0 auto;
  }
  #delivery.is-in{opacity:1}

  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    padding-bottom:30px;
  }
  .head-right{text-align:right}

  .badge{
    display:inline-block;
    padding:5px 13px;
    border-radius:999px;
    background:var(--green-dim);
    border:1px solid rgba(59,167,118,.34);
    color:var(--green);
    font-size:9.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
  }
  .date{
    margin-top:9px;
    font-size:10.5px;
    letter-spacing:.13em;
    color:var(--muted);
  }

  .count{
    font-size:10.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    padding:26px 0 34px;
    border-top:1px solid rgba(255,255,255,.09);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(268px,330px));
    justify-content:center;
    gap:46px 30px;
  }

  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .45s var(--ease);
  }
  .card:hover{transform:translateY(-8px)}

  .card-num{
    font-size:10.5px;
    letter-spacing:.22em;
    color:var(--muted-2);
    margin-bottom:13px;
    font-variant-numeric:tabular-nums;
  }

  .frame{
    position:relative;
    width:100%;
    aspect-ratio:9/16;
    border-radius:14px;
    overflow:hidden;
    background:#0b0b0b;
    border:1px solid rgba(255,255,255,.08);
  }
  .frame video{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .frame iframe{
    width:100%;height:100%;
    border:0;
    display:block;
  }
  .frame-fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    text-decoration:none;
  }
  .frame-fallback:hover{color:var(--white)}

  .dur{
    position:absolute;
    right:9px;bottom:9px;
    padding:3px 8px;
    border-radius:4px;
    background:rgba(0,0,0,.72);
    font-size:10px;
    letter-spacing:.05em;
    color:var(--white);
    opacity:0;
    transform:translateY(4px);
    transition:opacity .35s var(--ease),transform .35s var(--ease);
    pointer-events:none;
  }
  .card:hover .dur{opacity:1;transform:translateY(0)}

  .card-title{
    margin-top:15px;
    font-size:11px;
    letter-spacing:.15em;
    text-transform:uppercase;
    text-align:center;
    color:var(--white);
    line-height:1.55;
  }

  /* ---------- auto-scrolling stills ---------- */
  .stills{
    margin-top:72px;
    padding-top:30px;
    border-top:1px solid rgba(255,255,255,.09);
  }
  .stills-label{
    font-size:10.5px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    padding-bottom:24px;
  }
  .marquee{
    position:relative;
    overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  }
  .marquee-track{
    display:flex;
    gap:18px;
    width:max-content;
    animation:marquee 38s linear infinite;
  }
  .marquee:hover .marquee-track{animation-play-state:paused}
  .still{
    height:290px;
    width:auto;
    border-radius:14px;
    display:block;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.08);
    background:#0b0b0b;
    flex:none;
    transition:transform .45s var(--ease),opacity .45s var(--ease);
  }
  .marquee:hover .still{opacity:.55}
  .marquee .still:hover{opacity:1;transform:translateY(-6px)}
  @keyframes marquee{
    from{transform:translateX(0)}
    to{transform:translateX(calc(-50% - 9px))}
  }

  .foot{
    text-align:center;
    padding-top:66px;
  }
  .credit{
    margin-top:44px;
    font-size:9.5px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted-2);
  }

  @media (max-width:640px){
    #delivery{padding:26px 20px 46px}
    .grid{grid-template-columns:minmax(0,330px);justify-content:center;gap:40px}
    .logo--lg{width:94px;height:94px}
    .pill{padding:14px 32px;font-size:11px}
    .welcome-name{font-size:11px;letter-spacing:.34em;text-indent:.34em}
    .stills{margin-top:56px}
    .still{height:220px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .logo{animation:none}
    .marquee-track{animation:none!important;width:auto}
    .marquee{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      -webkit-mask-image:none;
      mask-image:none;
    }
    .marquee-track .still[aria-hidden="true"]{display:none}
  }
</style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow"></div>

<script>
/* ---------- logo fallback: plain white circle, no text ---------- */
document.querySelectorAll('img.logo').forEach(function(img){
  var src = img.getAttribute('src');
  var missing = !src || src.indexOf('[') === 0;

  function fallback(){
    if (!img.parentNode) return;
    var d = document.createElement('div');
    d.className = img.className;
    img.replaceWith(d);
  }

  if (missing) { fallback(); return; }

  img.addEventListener('error', function(){
    console.warn('Logo failed to load:', src);
    fallback();
  });

  // the image may have already failed before this script ran
  if (img.complete && img.naturalWidth === 0) {
    console.warn('Logo failed to load:', src);
    fallback();
  }
});

/* ---------- custom cursor with lag ---------- */
(function(){
  var dot  = document.getElementById('cursor');
  var glow = document.getElementById('cursorGlow');
  if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;

  var mx = innerWidth/2, my = innerHeight/2;
  var dx = mx, dy = my, gx = mx, gy = my;

  addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; });

  (function loop(){
    dx += (mx - dx) * 0.19;   // slight lag
    dy += (my - dy) * 0.19;
    gx += (mx - gx) * 0.10;   // glow trails further behind
    gy += (my - gy) * 0.10;
    dot.style.transform  = 'translate(' + dx + 'px,' + dy + 'px) translate(-50%,-50%)';
    glow.style.transform = 'translate(' + gx + 'px,' + gy + 'px) translate(-50%,-50%)';
    requestAnimationFrame(loop);
  })();

  document.addEventListener('mouseover', function(e){
    if (e.target.closest('.pill, .frame')) dot.classList.add('is-big');
  });
  document.addEventListener('mouseout', function(e){
    if (e.target.closest('.pill, .frame')) dot.classList.remove('is-big');
  });
})();

/* ---------- soft tone on enter ---------- */
function playTone(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = new Ctx();
    var t = ctx.currentTime;

    [523.25, 784.0].forEach(function(freq, i){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var start = t + i * 0.08;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.07, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.1);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 1.2);
    });

    setTimeout(function(){ ctx.close(); }, 1800);
  }catch(e){}
}

/* ---------- screen transition ---------- */
document.getElementById('enterBtn').addEventListener('click', function(){
  playTone();
  document.getElementById('welcome').classList.add('is-out');
  document.getElementById('delivery').classList.add('is-in');
  setTimeout(function(){ window.scrollTo(0,0); }, 60);
});

/* ---------- videos are hardcoded Vimeo embeds; nothing to resolve ---------- */
</script>
